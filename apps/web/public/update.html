<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>正在更新</title>
    <style>
      body {
        font-family: 'PingFang SC', -apple-system, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #7ec8ff;
        color: #1d3148;
        font-size: 22px;
      }
    </style>
  </head>
  <body>
    <p>正在换成新版本…</p>
    <script>
      (async () => {
        const fullReset = window.location.search.includes('full=1');
        const registrations = (await navigator.serviceWorker?.getRegistrations?.()) ?? [];
        await Promise.all(registrations.map((registration) => registration.unregister()));
        const keys = (await caches?.keys?.()) ?? [];
        await Promise.all(
          keys
            .filter((key) => fullReset || key !== 'kea-static-v4')
            .map((key) => caches.delete(key)),
        );
        if (!fullReset && typeof caches !== 'undefined') {
          try {
            const staticCache = await caches.open('kea-static-v4');
            const requests = await staticCache.keys();
            await Promise.all(
              requests
                .filter((req) => req.url.includes('worker.min.js'))
                .map((req) => staticCache.delete(req)),
            );
          } catch {
            // 忽略静态缓存清理异常
          }
        }
        window.location.replace(new URL('.', window.location.href).href);
      })();
    </script>
  </body>
</html>
